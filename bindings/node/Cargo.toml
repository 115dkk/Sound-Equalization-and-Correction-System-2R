[package]
name = "secs-node-sys"
description = "The Node-API isolation crate for the secs2r npm package."
version = "0.20.0"
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
repository.workspace = true
publish = false

[lib]
name = "secs2r_node"
crate-type = ["cdylib"]

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
dbg_macro = "deny"

[dependencies]
napi = { version = "3.16.1", default-features = false, features = ["napi8", "tokio_rt", "serde-json"] }
napi-derive = "3.7.0"
secs = { package = "sound-equalization-and-correction-system-rust-api", path = "../../crates/secs-api", version = "=0.20.0", default-features = false, features = ["engine", "client"] }
serde_json.workspace = true
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }

[build-dependencies]
napi-build = "2.6.0"
