[package]
name = "secs-py"
description = "Python bindings for the SECS 2R embedded engine and local API client."
version = "0.15.0"
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
repository.workspace = true
publish = false

[lib]
name = "_secs2r"
crate-type = ["cdylib"]
test = false

[lints]
workspace = true

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py39", "extension-module"] }
secs = { package = "sound-equalization-and-correction-system-rust-api", path = "../../crates/secs-api", version = "=0.15.0", default-features = false, features = ["engine", "client"] }
serde_json.workspace = true
