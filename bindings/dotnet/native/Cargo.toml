[package]
name = "secs-dotnet-sys"
description = "The C ABI isolation crate for the Secs2R .NET package."
version = "0.24.0"
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
repository.workspace = true
publish = false

[lib]
name = "secs2r_native"
crate-type = ["cdylib", "rlib"]

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
dbg_macro = "deny"

[dependencies]
secs = { package = "sound-equalization-and-correction-system-rust-api", path = "../../../crates/secs-api", version = "=0.24.0", default-features = false, features = ["engine", "client"] }
serde_json.workspace = true

[build-dependencies]
csbindgen = "1.9.8"
