secs-project.workspace = true
secs-audio.workspace = true
getrandom = "0.3"
secs-rew.workspace = true
secs-dsp.workspace = true
secs-dirac.workspace = true
secs-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
secs-apply.workspace = true
secs-dirac = { workspace = true, features = ["test-support"] }
