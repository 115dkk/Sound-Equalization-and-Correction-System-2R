[package]
name = "secs-service"
description = "The application service: project session, requests, jobs, stage cache and staleness, export assembly."
version = "0.15.0"
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
repository.workspace = true
homepage = "https://github.com/115dkk/Sound-Equalization-and-Correction-System-2R"
