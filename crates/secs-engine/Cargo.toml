[package]
name = "secs-engine"
description = "The SECS 2 correction design: measurement, levels and delays, BA, XO, RC, decay, signal chain, MIMO and scorecard."
version = "0.11.1"
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
repository.workspace = true
homepage = "https://github.com/115dkk/Sound-Equalization-and-Correction-System-2R"
readme = "README.md"
keywords = ["audio", "equalization", "correction", "mimo", "dsp"]
categories = ["multimedia::audio", "science"]
include = ["Cargo.toml", "README.md", "LICENSE", "src/**"]

[lints]
workspace = true

[[example]]
name = "engine_perf"
required-features = ["test-support"]

[features]
test-support = []

[dependencies]
faer.workspace = true
secs-types.workspace = true
secs-compute.workspace = true
secs-dsp.workspace = true
thiserror.workspace = true

[dev-dependencies]
secs-oracle.workspace = true
serde_json.workspace = true
