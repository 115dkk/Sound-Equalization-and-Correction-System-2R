[package]
name = "secs-engine"
description = "The SECS 2 correction design: measurement, levels and delays, BA, XO, RC, decay, signal chain, MIMO and scorecard."
version = "0.25.2"
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
repository.workspace = true
readme = "README.md"
keywords = ["audio", "equalization", "correction", "mimo", "dsp"]
categories = ["multimedia::audio", "science"]
include = ["Cargo.toml", "README.md", "LICENSE", "src/**"]

[lints]
workspace = true

[[example]]
name = "engine_perf"
required-features = ["test-support"]

[features]
test-support = ["dep:serde_json", "dep:secs-graph", "secs-compute/test-support"]

[dependencies]
faer.workspace = true
secs-types.workspace = true
secs-compute.workspace = true
secs-dsp.workspace = true
# Only the tests and `test-support` format tap counts with it.
secs-graph = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
secs-compute = { workspace = true, features = ["test-support"] }
secs-graph.workspace = true
secs-engine-testkit.workspace = true
secs-oracle.workspace = true
serde_json.workspace = true
sha2.workspace = true
