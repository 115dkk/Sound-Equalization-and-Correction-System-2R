[package]
name = "secs-camilla"
description = "CamillaDSP v4 configuration and FIR coefficient writer, reading the engine's signal-chain value."
version = "0.4.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/115dkk/Sound-Equalization-and-Correction-System-2R"
readme = "README.md"
keywords = ["audio", "camilladsp", "equalization", "fir"]
categories = ["multimedia::audio", "config"]
include = ["Cargo.toml", "README.md", "LICENSE", "src/**"]

[lints]
workspace = true

[dependencies]
num-bigint = "0.4.6"
num-integer = "0.1.47"
num-traits = "0.2.19"
ryu = "=1.0.20"
secs-dsp.workspace = true
secs-graph.workspace = true
secs-types.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Path only, no version: Cargo leaves this dev-dependency out of the published
# package, so secs-filters (which depends on this crate) does not form a cycle.
secs-filters = { path = "../secs-filters" }
secs-oracle.workspace = true
serde_json.workspace = true
