[package]
name = "secs-sys"
description = "The isolation crate: OS audio backends (WASAPI, cpal) and OS probes behind safe interfaces."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
secs-audio.workspace = true
secs-rew.workspace = true
secs-compute.workspace = true
sysinfo.workspace = true

[target.'cfg(not(target_os = "windows"))'.dependencies]
cpal = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.25"
audio_thread_priority = { version = "0.37.0", default-features = false }
