[package]
name = "secs-sys"
description = "The isolation crate: OS audio backends (WASAPI, cpal) and OS probes behind safe interfaces."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
dbg_macro = "deny"

[dependencies]
secs-audio.workspace = true
secs-rew.workspace = true
secs-compute.workspace = true
sysinfo.workspace = true
chrono.workspace = true
raw-window-handle = "0.6"
thiserror.workspace = true

[target.'cfg(not(target_os = "windows"))'.dependencies]
cpal = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.25"
audio_thread_priority = { version = "0.37.0", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
