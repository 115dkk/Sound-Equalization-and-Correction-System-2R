[package]
name = "secs-dsp"
description = "f64 DSP primitives and optimizers shared by the engine, the mdat builder, the CamillaDSP writer and the measurement path."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/115dkk/Sound-Equalization-and-Correction-System-2R"
readme = "README.md"
keywords = ["audio", "dsp", "equalization", "optimization"]
categories = ["multimedia::audio", "science", "algorithms"]
include = ["Cargo.toml", "README.md", "LICENSE", "src/**"]

[lints]
workspace = true

[dependencies]
rustfft.workspace = true
realfft.workspace = true
faer.workspace = true
pulp.workspace = true
gemm.workspace = true
faer-traits.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
secs-oracle = { path = "../secs-oracle" }
serde_json.workspace = true

# Not imported: these give faer runtime SIMD detection without its `std`
# (see the faer note in the workspace Cargo.toml, docs/adr/0007).
[package.metadata.cargo-machete]
ignored = ["pulp", "gemm", "faer-traits"]
