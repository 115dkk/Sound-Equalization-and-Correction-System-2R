name: 버그 신고 / Bug report
description: SECS 2R이 기대와 다르게 동작할 때 / When SECS 2R does not behave as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요 / What happened
      description: 무엇을 했고, 무엇을 기대했고, 실제로 무엇이 보였는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 순서 / Steps to reproduce
      placeholder: |
        1. 프로젝트를 연다
        2. 보정 단계에서 '추천 보정 계산'을 누른다
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SECS 2R 버전 / Version
      description: 앱의 정보 화면 또는 `secs2r-cli bootstrap`의 version과 upstream
      placeholder: 0.0.1 (SECS 2 Beta 1.2.0 기준)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 운영체제 / OS
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
    validations:
      required: true
  - type: dropdown
    id: measurement
    attributes:
      label: 측정 방식 / Measurement
      options:
        - 해당 없음 / Not related
        - 자체 측정 / Native
        - REW API (Pro)
        - mdat 가져오기 / mdat import
  - type: textarea
    id: files
    attributes:
      label: 파일과 로그 / Files and logs
      description: 붙일 수 있으면 프로젝트 파일(.secs와 .irs 폴더), mdat, 오류의 '자세히' 내용을 붙여 주세요.
  - type: textarea
    id: upstream
    attributes:
      label: 업스트림 SECS 2에서는 / In upstream SECS 2
      description: 같은 입력으로 SECS 2에서는 어떻게 되는지 알면 적어 주세요.
