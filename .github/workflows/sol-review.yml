name: Sol PR review

# Reviews a pull request of this repository with Sol through the Responses API
# and posts the result as a review (.github/sol-review/README.md). Enabled by
# default; set SOL_REVIEW_ENABLED=false to opt out.
#
# workflow_run always runs this file and the scripts from main, so the pull
# request under review cannot change its reviewer. The trigger is the
# completion of sol-review-request.yml (pull_request); nothing that run makes
# is used. The pull request is found from the head commit GitHub records for
# that run, and its files are read through the API as data: nothing of it is
# checked out or executed.
on:
  workflow_run:
    workflows: ["Sol review request"]
    types: [completed]

permissions: {}
concurrency:
  # A newer push to the same branch makes an older review stale. The group is
  # decided before any job's `if`, so it names the head repository too: a
  # fork's run with the same branch name must not cancel a real review.
  group: sol-review-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      vars.SOL_REVIEW_ENABLED != 'false' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.path, '.github/workflows/sol-review-request.yml') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
    steps:
      # main, the reviewer; github.sha is main's tip under workflow_run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: trusted
      - name: Prepare bounded review input
        id: prepare
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I trusted/.github/scripts/sol_review.py prepare --directory review-data
      - name: Review with Sol through Responses API
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 32
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEW_MODEL: ${{ vars.SOL_REVIEW_MODEL || 'gpt-6.1-sol' }}
          REVIEW_EFFORT: ${{ vars.SOL_REVIEW_EFFORT || 'xhigh' }}
          REVIEW_CACHE_TTL: ${{ vars.SOL_REVIEW_CACHE_TTL || '30m' }}
          REVIEW_MAX_OUTPUT_TOKENS: ${{ vars.SOL_REVIEW_MAX_OUTPUT_TOKENS || '64000' }}
          REVIEW_TIMEOUT_SECONDS: ${{ vars.SOL_REVIEW_TIMEOUT_SECONDS || '1800' }}
        run: >-
          python3 -I trusted/.github/scripts/sol_review_api.py --directory review-data
          --policy trusted/.github/sol-review/policy.txt --guide trusted/.github/sol-review/guide.md
          --rules trusted/CLAUDE.md --rules trusted/CONTEXT.md
          --schema trusted/.github/sol-review/result.schema.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sol-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            review-data/metadata.json
            review-data/result.json
            review-data/failure.json
          if-no-files-found: warn
          retention-days: 3

  publish:
    needs: review
    if: ${{ always() && needs.review.result != 'skipped' && needs.review.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # contents: write only because GitHub refuses resolveReviewThread to an
    # integration token without it (PR #164, 2026-11-03; maintainer approved
    # the same day). This job runs main's code and never checks out or
    # executes anything of the pull request; main itself stays behind the
    # ruleset.
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: trusted
      # This run's own artifact, made by the review job above from main's code.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: sol-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: review-data
      - name: Validate and publish review or completion notice
        env:
          GH_TOKEN: ${{ github.token }}
          # Explicit false permits dry-run; normal enabled operation publishes.
          REVIEW_PUBLISH: ${{ vars.SOL_REVIEW_PUBLISH != 'false' }}
        run: python3 -I trusted/.github/scripts/sol_review.py publish --directory review-data
