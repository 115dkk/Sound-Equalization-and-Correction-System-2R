name: CI

# Gates every pull request and every push to main (docs/adr/0002, 0006).
#
#   lint      fmt, clippy -D warnings (also for the Windows target, so
#             cfg(windows) code is linted from Linux), the secs-policy gates,
#             the CI scripts' unit tests, and the upstream Python tree check
#   test      cargo test on Linux, Windows and macOS (the engine also in
#             release mode on the foreign-libm path, as release.yml tests it);
#             on Linux also that every test features.toml names is one Cargo
#             compiles and runs
#   frontend  typecheck, unit tests and build of the screen, and the IPC
#             bindings regenerated from secs-types must match the committed copy
#   gallery   every gallery specimen in Chromium, light and dark, Korean and
#             English and the tutorial accent: no page error, no text under
#             the 13 px floor, one PNG per data-gallery-id kept as an artifact
#   bundle    the installers of every OS built as on release day, kept as run
#             artifacts so a pull request can be installed and tried
#   docs      rustdoc with warnings denied
#   deny      cargo-deny: advisories, GPL-compatible licenses, bans, sources
#   miri      the parsers of untrusted files (secs-jos, secs-mdat, secs-dirac)
#             under Miri
#   fuzz      every fuzz target (fuzz/) for a fixed time from a seed corpus
#   integrity the CLI's mock flow and a four-position MIMO flow at 1, the
#             default and 7 threads on every OS; the exports must be
#             byte-identical (docs/adr/0007)
#   eqapo-playback  Equalizer APO exports (with and without MIMO) played
#             through the Benchmark of EqualizerAPO-XT and of the official
#             Equalizer APO, pinned in .github/eqapo-engines.toml; every
#             input-to-output response must match the designed one
#             (crates/secs-filters/tests/eqapo_playback.rs, DEVIATIONS F12)
#
# Pin macOS 15 ARM64 after repeated macOS 26 runner allocation failures.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Miri and cargo-fuzz need nightly; pinned so a nightly regression cannot
  # turn CI red on an unrelated change. Bump deliberately.
  NIGHTLY: nightly-2026-10-01
  # Tauri's Linux stack (WebKitGTK 4.1) and ALSA for cpal.
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
    librsvg2-dev libsoup-3.0-dev libasound2-dev patchelf

jobs:
  lint:
    name: fmt + clippy + policy gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # upstream.py check-tree compares against UPSTREAM.toml's commit.
          fetch-depth: 0

      - name: Linux packages for Tauri and ALSA
        run: |
          # LINUX_DEPS is a space-separated package list, split on purpose.
          # shellcheck disable=SC2086
          sudo apt-get update -qq && sudo apt-get install -y -qq $LINUX_DEPS

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add x86_64-pc-windows-msvc
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Type-checking needs no linker, so the Windows target is linted here
      # too. The Tauri app is left out: its build script compiles Windows
      # resources, which needs the Windows SDK.
      - name: cargo clippy for Windows x64 (deny warnings)
        run: cargo clippy --workspace --exclude secs2r --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings

      - name: Policy gates (crates/secs-policy)
        run: cargo test -p secs-policy --locked -- --nocapture

      - name: CI script unit tests (.github/scripts)
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py" -v

      - name: Upstream Python tree is untouched (docs/adr/0001)
        run: python3 .github/scripts/upstream.py check-tree

  test:
    name: cargo test (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux packages for Tauri and ALSA
        if: runner.os == 'Linux'
        run: |
          # LINUX_DEPS is a space-separated package list, split on purpose.
          # shellcheck disable=SC2086
          sudo apt-get update -qq && sudo apt-get install -y -qq $LINUX_DEPS

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - name: cargo test --workspace
        run: cargo test --workspace --all-targets --locked

      - name: cargo test --doc
        run: cargo test --workspace --doc --locked

      # release.yml tests in release mode with every oracle test on its
      # foreign-libm path. The engine's timing- and libm-dependent tests behave
      # differently there (0.6.0's cancellation test passed here and failed
      # the release twice), so run them the same way before a merge.
      - name: cargo test -p secs-engine (release mode, foreign libm)
        env:
          SECS_ORACLE_FOREIGN_LIBM: "1"
        run: cargo test -p secs-engine --release --locked

      # secs-policy only sees `#[test] fn` in source; this asks Cargo that each
      # test features.toml names is compiled and run (an orphan file is not).
      - name: features.toml names tests Cargo runs
        if: runner.os == 'Linux'
        run: python3 .github/scripts/check_feature_tests.py

  integrity:
    name: integrity (${{ matrix.os }}, 1 / default / 7 threads)
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: ALSA for cpal (the CLI links secs-sys)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integrity

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Two builds: with `--example` Cargo builds only that example, not the
      # package binaries.
      - name: Build the CLI and the oracle-case example (release)
        run: |
          cargo build --release --locked -p secs2r-cli
          cargo build --release --locked -p secs-service --example case_project

      # Each run writes to the same folder, because the CamillaDSP files name
      # their own absolute paths; the export is moved aside before the next.
      # The sample flow measures through the simulated room (one position, no
      # MIMO); room_dba has four positions, so its flow runs MIMO too.
      - name: Run both flows at three thread counts
        run: |
          set -euo pipefail
          bin=target/release
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          mkdir -p integrity
          "$bin/examples/case_project$exe" --mimo-on room_dba integrity/case/project.secs
          for threads in 1 default 7; do
            if [ "$threads" = default ]; then unset RAYON_NUM_THREADS; else export RAYON_NUM_THREADS=$threads; fi
            rm -rf integrity/run
            start=$SECONDS
            "$bin/secs2r-cli$exe" --quiet --compute cpu --deterministic-uuids run --fill mock --out integrity/run
            echo "sample flow, $threads threads: $((SECONDS - start)) s"
            mv integrity/run/export "integrity/sample-$threads"
            rm -rf integrity/run
            cp -R integrity/case integrity/run
            start=$SECONDS
            "$bin/secs2r-cli$exe" --quiet --compute cpu --deterministic-uuids run --project integrity/run/project.secs --mimo --out integrity/run
            echo "room_dba flow with MIMO, $threads threads: $((SECONDS - start)) s"
            mv integrity/run/export "integrity/case-$threads"
          done

      - name: Compare the exports byte for byte
        run: |
          python .github/scripts/integrity.py compare integrity/sample-default integrity/sample-1 integrity/sample-7
          python .github/scripts/integrity.py compare integrity/case-default integrity/case-1 integrity/case-7

  eqapo-playback:
    name: Equalizer APO playback (${{ matrix.engine }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        engine: [xt, original]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The official Benchmark has no config-path argument and reads the
      # ConfigPath registry value; --register points it at a folder of the
      # runner's (a disposable machine), which the test exports into.
      - name: Fetch the engine (.github/eqapo-engines.toml)
        shell: pwsh
        run: |
          $register = if ("${{ matrix.engine }}" -eq "original") { "--register" } else { $null }
          python .github/scripts/eqapo_engine.py fetch --engine ${{ matrix.engine }} --dest "$env:RUNNER_TEMP\eqapo" --github-env "$env:GITHUB_ENV" $register

      - name: Play the exports through the engine
        env:
          SECS_EQAPO_REPORT: ${{ runner.temp }}\eqapo-report.md
          SECS_EQAPO_ARTIFACTS: ${{ runner.temp }}\eqapo-artifacts
        run: cargo test -p secs-filters --test eqapo_playback --locked -- --ignored --nocapture

      # The exported folders and every engine log, to read a failure from.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eqapo-playback-${{ matrix.engine }}
          path: ${{ runner.temp }}/eqapo-artifacts
          if-no-files-found: ignore

      - name: Report
        if: always()
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "eqapo-report.md"
          if (Test-Path $report) { Get-Content $report | Add-Content $env:GITHUB_STEP_SUMMARY }

  frontend:
    name: screen (typecheck, tests, build, IPC bindings)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/secs2r/ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/secs2r/ui/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install the pinned toolchain (rust-toolchain.toml)
        working-directory: .
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bindings

      # ts-rs writes the bindings while secs-types' tests run
      # (.cargo/config.toml sets TS_RS_EXPORT_DIR).
      - name: IPC bindings match secs-types
        working-directory: .
        run: |
          rm -rf apps/secs2r/ui/src/ipc/bindings
          cargo test -p secs-types --locked
          git add -N apps/secs2r/ui/src/ipc/bindings
          if ! git diff --exit-code -- apps/secs2r/ui/src/ipc/bindings; then
            echo "::error::apps/secs2r/ui/src/ipc/bindings differs from what secs-types generates; run 'cargo test -p secs-types' and commit the result"
            exit 1
          fi

  gallery:
    name: screen gallery (Chromium screenshots)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/secs2r/ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/secs2r/ui/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      # The Chromium build that matches the pinned playwright in package.json.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the app and the gallery
        run: npm run build:gallery

      - name: Screenshot every specimen
        run: npm run gallery:shots

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: gallery-shots
          path: apps/secs2r/ui/gallery-shots/
          if-no-files-found: ignore
          retention-days: 14

  bundle:
    name: installers (${{ matrix.name }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis
            target: ""
          - name: macos
            os: macos-15
            bundles: app,dmg
            target: universal-apple-darwin
          - name: linux
            os: ubuntu-22.04
            bundles: appimage,deb
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux packages for Tauri and ALSA
        if: runner.os == 'Linux'
        run: |
          # LINUX_DEPS is a space-separated package list, split on purpose.
          # shellcheck disable=SC2086
          sudo apt-get update -qq && sudo apt-get install -y -qq $LINUX_DEPS libfuse2

      - name: Install the pinned toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bundle-${{ matrix.name }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/secs2r/ui/package-lock.json

      - name: npm ci
        working-directory: apps/secs2r/ui
        run: npm ci --no-audit --no-fund

      - name: tauri build
        working-directory: apps/secs2r
        shell: bash
        run: |
          args=(build --ci --bundles "${{ matrix.bundles }}")
          if [ -n "${{ matrix.target }}" ]; then args+=(--target "${{ matrix.target }}"); fi
          node ui/node_modules/@tauri-apps/cli/tauri.js "${args[@]}"

      # Windows runners have `python`, not always `python3`.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Collect installers
        shell: bash
        run: python .github/scripts/collect_bundles.py --name "${{ matrix.name }}" --target "${{ matrix.target }}" --version "0.0.0-ci.${{ github.run_number }}" --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  docs:
    name: rustdoc (deny warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Linux packages for Tauri and ALSA
        run: |
          # LINUX_DEPS is a space-separated package list, split on purpose.
          # shellcheck disable=SC2086
          sudo apt-get update -qq && sudo apt-get install -y -qq $LINUX_DEPS

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny --all-features check

  miri:
    name: Miri (secs-jos, secs-mdat, secs-dirac)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned nightly with Miri
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component miri,rust-src
          cargo "+$NIGHTLY" miri setup

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: miri

      # Tests that parse the 218 kB template are ignored under Miri (too slow);
      # they run natively in the test job.
      - name: cargo miri test
        run: cargo "+$NIGHTLY" miri test --locked -p secs-jos -p secs-mdat -p secs-dirac

  fuzz:
    name: fuzz (parsers, 60 s per target)
    runs-on: ubuntu-latest
    env:
      FUZZ_TARGET: x86_64-unknown-linux-gnu
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned nightly
        run: rustup toolchain install "$NIGHTLY" --profile minimal

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.1

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz
          workspaces: fuzz

      # The prebuilt cargo-fuzz is a musl binary and would default to the musl
      # target, where AddressSanitizer cannot link; name the gnu target.
      - name: Build the fuzz targets
        run: cargo "+$NIGHTLY" fuzz build --target "$FUZZ_TARGET"

      # Seeds: the bundled REW template, the mdat golden blobs and the
      # synthetic Dirac Live project (sample projects hold personal data).
      - name: Run every target
        run: |
          for target in $(cargo "+$NIGHTLY" fuzz list); do
            mkdir -p "corpus/$target"
            cp ../src/secs/rew_mdat/template_1.mdat "corpus/$target/template"
            cp ../oracle/goldens/mdat/*.bin "corpus/$target/"
            cp ../crates/secs-dirac/tests/data/*.liveproject "corpus/$target/"
            echo "::group::$target"
            cargo "+$NIGHTLY" fuzz run --target "$FUZZ_TARGET" "$target" "corpus/$target" -- \
              -max_total_time=60 -rss_limit_mb=2048 -max_len=262144
            echo "::endgroup::"
          done

      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14
