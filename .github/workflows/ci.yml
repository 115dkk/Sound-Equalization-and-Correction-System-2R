name: CI

# Gates every pull request (docs/adr/0002, 0006). A merge does not run it
# again: the pull request ran it on its merge with main, and release.yml tests
# the release build before it packages. Without runs on main there is no
# default-branch cache, so the first run of each pull request builds cold.
# workflow_dispatch runs it by hand on any branch.
#
#   lint      fmt, clippy -D warnings (also for the Windows target, so
#             cfg(windows) code is linted from Linux), the secs-policy gates,
#             the CI scripts' unit tests, the upstream Python tree check, and
#             a dry run of publishing the crates.io crates
#   test      cargo test on Linux, Windows and macOS (the engine also in
#             release mode on the foreign-libm path, as release.yml tests it);
#             on Linux also that every test features.toml names is one Cargo
#             compiles and runs
#   frontend  typecheck, unit tests and build of the screen, and the IPC
#             bindings regenerated from secs-types must match the committed copy
#   gallery   every gallery specimen in Chromium, light and dark, Korean and
#             English and the tutorial accent: no page error, no text under
#             the 13 px floor, one PNG per data-gallery-id kept as an artifact
#   bundle    the installers of every OS built as on release day, kept as run
#             artifacts so a pull request can be installed and tried; the
#             macOS dmg must open and calibrate (.github/scripts/
#             macos_app_check.py: bundle signature, microphone permission,
#             and a mock-room calibration through the app's own screen on
#             Apple Silicon and under Rosetta)
#   docs      rustdoc with warnings denied
#   deny      cargo-deny: advisories, GPL-compatible licenses, bans, sources
#   miri      the parsers of untrusted files (secs-jos, secs-mdat, secs-dirac)
#             under Miri
#   fuzz      every fuzz target (fuzz/) for a fixed time from a seed corpus
#   integrity the CLI's mock flow and a four-position MIMO flow at 1, the
#             default and 7 threads on every OS; the exports must be
#             byte-identical (docs/adr/0007)
#   eqapo-playback  Equalizer APO exports (with and without MIMO) played
#             through the Benchmark of EqualizerAPO-XT and of the official
#             Equalizer APO, pinned in .github/eqapo-engines.toml; every
#             input-to-output response must match the designed one
#             (crates/secs-filters/tests/eqapo_playback.rs, DEVIATIONS F12)
#   camilla-playback  CamillaDSP exports and their bypass configs played
#             through the official CamillaDSP release pinned in
#             .github/camilladsp-engines.toml, with the same bounds as the
#             Equalizer APO check (crates/secs-camilla/tests/camilla_playback.rs,
#             issue #107)
#   manage-e2e  installed Windows app and shell driven through WebDriver:
#             real service takeover, restart, Equalizer APO repair and removal
#
# Pin macOS 15 ARM64 after repeated macOS 26 runner allocation failures.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Miri and cargo-fuzz need nightly; pinned so a nightly regression cannot
  # turn CI red on an unrelated change. Bump deliberately.
  NIGHTLY: nightly-2026-10-01
  # Tauri's Linux stack (WebKitGTK 4.1) and ALSA for cpal.
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
    librsvg2-dev libsoup-3.0-dev libasound2-dev patchelf

jobs:
  lint:
    name: fmt + clippy + policy gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # upstream.py check-tree compares against UPSTREAM.toml's commit.
          fetch-depth: 0

      - name: Linux packages for Tauri and ALSA
        run: |
          # LINUX_DEPS is a space-separated package list, split on purpose.
          # shellcheck disable=SC2086
          sudo apt-get update -qq && sudo apt-get install -y -qq $LINUX_DEPS

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add x86_64-pc-windows-msvc
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Type-checking needs no linker, so the Windows target is linted here
      # too. The Tauri app is left out: its build script compiles Windows
      # resources, which needs the Windows SDK.
      - name: cargo clippy for Windows x64 (deny warnings)
        run: cargo clippy --workspace --exclude secs2r --exclude secs2r-host-shell --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings

      - name: Policy gates (crates/secs-policy)
        run: cargo test -p secs-policy --locked -- --nocapture

      - name: CI script unit tests (.github/scripts)
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py" -v

      - name: Upstream Python tree is untouched (docs/adr/0001)
        run: python3 .github/scripts/upstream.py check-tree

      # The crates.io crates (docs/adr/0016) build from their packaged files
      # alone, every one against the packages of the others. A fresh runner
      # has no extracted copies of earlier packages in CARGO_HOME to reuse.
      # Once a version is on crates.io, a crate changed since keeps that
      # version until the release gate bumps it, and Cargo will not verify a
      # local package whose name and version crates.io has with another
      # checksum; api_dry_run.py moves them to <version>-dryrun first.
      - name: crates.io packages build (cargo publish --dry-run)
        run: |
          python3 .github/scripts/api_dry_run.py
          cargo publish --workspace --dry-run --locked --allow-dirty

  test:
    name: cargo test (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux packages for Tauri and ALSA
        if: runner.os == 'Linux'
        run: |
          # LINUX_DEPS is a space-separated package list, split on purpose.
          # shellcheck disable=SC2086
          sudo apt-get update -qq && sudo apt-get install -y -qq $LINUX_DEPS

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test

      - name: Lua compiler for generated REAPER scripts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
          echo "SECS_LUAC=$(command -v luac5.4)" >> "$GITHUB_ENV"
          echo "SECS_LUA=$(command -v lua5.4)" >> "$GITHUB_ENV"

      - name: cargo test --workspace
        run: cargo test --workspace --all-targets --locked

      - name: cargo test --doc
        run: cargo test --workspace --doc --locked

      # release.yml tests in release mode with every oracle test on its
      # foreign-libm path. The engine's timing- and libm-dependent tests behave
      # differently there (0.6.0's cancellation test passed here and failed
      # the release twice), so run them the same way before a merge.
      - name: cargo test -p secs-engine (release mode, foreign libm)
        env:
          SECS_ORACLE_FOREIGN_LIBM: "1"
        run: cargo test -p secs-engine --release --locked

      # secs-policy only sees `#[test] fn` in source; this asks Cargo that each
      # test features.toml names is compiled and run (an orphan file is not).
      - name: features.toml names tests Cargo runs
        if: runner.os == 'Linux'
        run: python3 .github/scripts/check_feature_tests.py

  integrity:
    name: integrity (${{ matrix.os }}, 1 / default / 7 threads)
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ALSA for cpal (the CLI links secs-sys)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: integrity

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # Two builds: with `--example` Cargo builds only that example, not the
      # package binaries.
      - name: Build the CLI and the oracle-case example (release)
        run: |
          cargo build --release --locked -p secs2r-cli
          cargo build --release --locked -p secs-service --example case_project

      # Each run writes to the same folder, because the CamillaDSP files name
      # their own absolute paths; the export is moved aside before the next.
      # The sample flow measures through the simulated room (one position, no
      # MIMO); room_dba has four positions, so its flow runs MIMO too.
      - name: Run both flows at three thread counts
        run: |
          set -euo pipefail
          bin=target/release
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          mkdir -p integrity
          "$bin/examples/case_project$exe" --mimo-on room_dba integrity/case/project.secs
          for threads in 1 default 7; do
            if [ "$threads" = default ]; then unset RAYON_NUM_THREADS; else export RAYON_NUM_THREADS=$threads; fi
            rm -rf integrity/run
            start=$SECONDS
            "$bin/secs2r-cli$exe" --quiet --compute cpu --deterministic-uuids run --fill mock --out integrity/run
            echo "sample flow, $threads threads: $((SECONDS - start)) s"
            mv integrity/run/export "integrity/sample-$threads"
            rm -rf integrity/run
            cp -R integrity/case integrity/run
            start=$SECONDS
            "$bin/secs2r-cli$exe" --quiet --compute cpu --deterministic-uuids run --project integrity/run/project.secs --mimo --out integrity/run
            echo "room_dba flow with MIMO, $threads threads: $((SECONDS - start)) s"
            mv integrity/run/export "integrity/case-$threads"
          done

      - name: Compare the exports byte for byte
        run: |
          python .github/scripts/integrity.py compare integrity/sample-default integrity/sample-1 integrity/sample-7
          python .github/scripts/integrity.py compare integrity/case-default integrity/case-1 integrity/case-7

  eqapo-playback:
    name: Equalizer APO playback (${{ matrix.engine }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        engine: [xt, original]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # The official Benchmark has no config-path argument and reads the
      # ConfigPath registry value; --register points it at a folder of the
      # runner's (a disposable machine), which the test exports into.
      - name: Fetch the engine (.github/eqapo-engines.toml)
        shell: pwsh
        run: |
          $register = if ("${{ matrix.engine }}" -eq "original") { "--register" } else { $null }
          python .github/scripts/eqapo_engine.py fetch --engine ${{ matrix.engine }} --dest "$env:RUNNER_TEMP\eqapo" --github-env "$env:GITHUB_ENV" $register

      - name: Play the exports through the engine
        env:
          SECS_EQAPO_REPORT: ${{ runner.temp }}\eqapo-report.md
          SECS_EQAPO_ARTIFACTS: ${{ runner.temp }}\eqapo-artifacts
        run: cargo test -p secs-filters --test eqapo_playback --locked -- --ignored --nocapture

      # The exported folders and every engine log, to read a failure from.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eqapo-playback-${{ matrix.engine }}
          path: ${{ runner.temp }}/eqapo-artifacts
          if-no-files-found: ignore

      - name: Report
        if: always()
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "eqapo-report.md"
          if (Test-Path $report) { Get-Content $report | Add-Content $env:GITHUB_STEP_SUMMARY }

  camilla-playback:
    name: CamillaDSP playback
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test

      - name: Fetch CamillaDSP (.github/camilladsp-engines.toml)
        run: python3 .github/scripts/camilla_engine.py fetch --engine linux --dest "$RUNNER_TEMP/camilladsp" --github-env "$GITHUB_ENV"

      - name: Play the exports through CamillaDSP
        env:
          SECS_CAMILLA_REPORT: ${{ runner.temp }}/camilla-report.md
          SECS_CAMILLA_ARTIFACTS: ${{ runner.temp }}/camilla-artifacts
        run: cargo test -p secs-camilla --test camilla_playback --locked -- --ignored --nocapture

      # The configs, excitation, output and CamillaDSP log of every case.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: camilla-playback
          path: ${{ runner.temp }}/camilla-artifacts
          if-no-files-found: ignore

      - name: Report
        if: always()
        run: |
          report="$RUNNER_TEMP/camilla-report.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

  reaper-playback:
    name: REAPER convolution playback
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux libraries, virtual display and Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-0t64 libasound2t64 libx11-6 libxext6 libxrender1 libfreetype6 libfontconfig1 libcurl4t64 xvfb xauth lua5.4
          echo "SECS_LUAC=$(command -v luac5.4)" >> "$GITHUB_ENV"
          echo "SECS_LUA=$(command -v lua5.4)" >> "$GITHUB_ENV"

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Fetch the pinned official REAPER archive
        run: python3 -I .github/scripts/reaper_engine.py fetch --dest "$RUNNER_TEMP/reaper-engine" --github-env "$GITHUB_ENV"

      - name: Compile and model-test the generated ReaScript
        run: cargo test -p secs-filters --locked reaper_script -- --nocapture

      - name: Render oracle bundles through REAPER under xvfb
        env:
          SECS_REAPER_ARTIFACTS: ${{ runner.temp }}/reaper-artifacts
        run: cargo test -p secs-filters --test reaper_playback --locked -- --ignored --nocapture

      # The Rust test copies an explicit allowlist of dumps, render WAVs and logs.
      # Never upload RUNNER_TEMP/reaper-engine (the official binary/archive).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reaper-playback
          path: ${{ runner.temp }}/reaper-artifacts
          if-no-files-found: ignore

  manage-e2e:
    name: Manage end to end (Windows GUI)
    needs: bundle
    # Needs only the Windows installer: a failed macOS or Linux leg of the
    # bundle matrix must not skip this job. A missing Windows artifact fails
    # the download step below.
    if: ${{ !cancelled() && needs.bundle.result != 'skipped' }}
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: manage-e2e

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers-windows
          path: ${{ runner.temp }}/manage-installers

      # Official VB-CABLE Pack45, hash-pinned in virtual-audio.toml, with a
      # valid signature required on its installer and driver catalog (Scream
      # 4.0's catalog certificate has expired). Downloads stay outside
      # artifacts; no test-signing or Secure Boot changes.
      - name: Start Windows Audio and install pinned VB-CABLE
        run: python -I .github/scripts/virtual_audio.py --dest "$env:RUNNER_TEMP\manage-vbcable"

      - name: Require an interactive console and report the environment
        run: python -I .github/scripts/manage_e2e.py env --artifacts "$env:RUNNER_TEMP\manage-e2e" --report "$env:RUNNER_TEMP\manage-env.md"

      - name: Install SECS 2R silently and resolve its uninstall entry
        run: |
          python -I -c "import runpy,sys; runpy.run_path(sys.argv[1])['install_app'](sys.argv[2])" "$env:GITHUB_WORKSPACE\.github\scripts\manage_e2e.py" "$env:RUNNER_TEMP\manage-installers"

      - name: Fetch pinned CamillaDSP for Windows
        run: python .github/scripts/camilla_engine.py fetch --engine windows --dest "$env:RUNNER_TEMP\manage-camilla" --github-env "$env:GITHUB_ENV"

      # XT's own v2.60.4 Install-ReleaseBuild.ps1 uses Setup.exe --silent.
      # Unlike --register (the Benchmark-only job), this requires the installer's
      # real HKLM ConfigPath and InstallPath and never invents registry values.
      - name: Install pinned Equalizer APO XT silently
        run: python .github/scripts/eqapo_engine.py fetch --engine xt --install-xt --dest "$env:RUNNER_TEMP\manage-xt" --github-env "$env:GITHUB_ENV"

      - name: Install tauri-driver 2.1.0 and a signed matching Edge driver
        run: |
          # 2.1.0 was released 2026-09-26, over two weeks before this pin.
          cargo install tauri-driver --locked --version 2.1.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -c "import runpy,sys; runpy.run_path(sys.argv[1])['prepare_edge'](sys.argv[2],sys.argv[3])" "$env:GITHUB_WORKSPACE\.github\scripts\manage_e2e.py" "$env:RUNNER_TEMP\manage-edge" "$env:RUNNER_TEMP\manage-e2e"

      - name: Drive the installed app and shell
        run: |
          python -I .github/scripts/manage_e2e.py run --installed-folder "$env:SECS_MANAGE_INSTALL" --camilla "$env:SECS_CAMILLADSP" --eqapo-config "$env:SECS_EQAPO_CONFIG_DIR" --tauri-driver "$env:USERPROFILE\.cargo\bin\tauri-driver.exe" --msedgedriver "$env:SECS_MSEDGEDRIVER" --artifacts "$env:RUNNER_TEMP\manage-e2e" --report "$env:RUNNER_TEMP\manage-e2e-report.md"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: manage-e2e
          path: |
            ${{ runner.temp }}/manage-e2e/**
            ${{ runner.temp }}/manage-env.md
            ${{ runner.temp }}/manage-e2e-report.md
            !${{ runner.temp }}/manage-e2e/**/*.exe
            !${{ runner.temp }}/manage-e2e/**/*.dll
            !${{ runner.temp }}/manage-e2e/**/*.zip
            !${{ runner.temp }}/manage-e2e/**/*.nupkg
            !${{ runner.temp }}/manage-e2e/**/*.7z
            !${{ runner.temp }}/manage-e2e/**/*.tar
            !${{ runner.temp }}/manage-e2e/**/*.gz
            !${{ runner.temp }}/manage-e2e/**/*.msi
            !${{ runner.temp }}/manage-e2e/**/*.sys
            !${{ runner.temp }}/manage-e2e/**/*.cat
            !${{ runner.temp }}/manage-e2e/**/*.inf
          if-no-files-found: ignore
          retention-days: 14

      - name: Report
        if: always()
        run: |
          $report = Join-Path $env:RUNNER_TEMP "manage-e2e-report.md"
          if (Test-Path $report) {
            Get-Content -Raw $report | Add-Content $env:GITHUB_STEP_SUMMARY
          } else {
            "## Manage end to end (Windows GUI)`n`nNOT RUN: a prerequisite failed; see the environment and preceding steps." | Add-Content $env:GITHUB_STEP_SUMMARY
          }

  frontend:
    name: screen (typecheck, tests, build, IPC bindings)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/secs2r/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/secs2r/ui/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install the pinned toolchain (rust-toolchain.toml)
        working-directory: .
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: bindings

      # ts-rs writes the bindings while secs-types' tests run
      # (.cargo/config.toml sets TS_RS_EXPORT_DIR).
      - name: IPC bindings match secs-types
        working-directory: .
        run: |
          rm -rf apps/secs2r/ui/src/ipc/bindings
          cargo test -p secs-types --locked
          git add -N apps/secs2r/ui/src/ipc/bindings
          if ! git diff --exit-code -- apps/secs2r/ui/src/ipc/bindings; then
            echo "::error::apps/secs2r/ui/src/ipc/bindings differs from what secs-types generates; run 'cargo test -p secs-types' and commit the result"
            exit 1
          fi

  gallery:
    name: screen gallery (Chromium screenshots)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/secs2r/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/secs2r/ui/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      # The Chromium build that matches the pinned playwright in package.json.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the app and the gallery
        run: npm run build:gallery

      - name: Screenshot every specimen
        run: npm run gallery:shots

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: gallery-shots
          path: apps/secs2r/ui/gallery-shots/
          if-no-files-found: ignore
          retention-days: 14

  bundle:
    name: installers (${{ matrix.name }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis
            target: ""
          - name: macos
            os: macos-15
            bundles: app,dmg
            target: universal-apple-darwin
          - name: linux
            os: ubuntu-22.04
            bundles: appimage,deb
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux packages for Tauri and ALSA
        if: runner.os == 'Linux'
        run: |
          # LINUX_DEPS is a space-separated package list, split on purpose.
          # shellcheck disable=SC2086
          sudo apt-get update -qq && sudo apt-get install -y -qq $LINUX_DEPS libfuse2

      - name: Install the pinned toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: bundle-${{ matrix.name }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/secs2r/ui/package-lock.json

      - name: npm ci
        working-directory: apps/secs2r/ui
        run: npm ci --no-audit --no-fund

      # As release.yml: built before tauri build, packed and run by
      # collect_bundles.py.
      - name: Build companion binaries
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            cargo build --release --locked -p secs2r-cli --target aarch64-apple-darwin
            cargo build --release --locked -p secs2r-cli --target x86_64-apple-darwin
            mkdir -p target/universal-apple-darwin/release
            lipo -create -output target/universal-apple-darwin/release/secs2r-cli \
              target/aarch64-apple-darwin/release/secs2r-cli \
              target/x86_64-apple-darwin/release/secs2r-cli
          else
            cargo build --release --locked -p secs2r-cli
          fi
          if [ "${{ matrix.name }}" = "windows" ]; then
            cargo build --release --locked -p secs2r-host
          fi

      - name: Build the host shell
        if: runner.os == 'Windows'
        working-directory: apps/secs2r-host-shell
        run: node ../secs2r/ui/node_modules/@tauri-apps/cli/tauri.js build --ci --no-bundle

      - name: tauri build
        working-directory: apps/secs2r
        shell: bash
        run: |
          args=(build --ci --bundles "${{ matrix.bundles }}")
          if [ -n "${{ matrix.target }}" ]; then args+=(--target "${{ matrix.target }}"); fi
          if [ "${{ matrix.name }}" = "windows" ]; then
            args+=(--config '{"bundle":{"resources":{"../../target/release/secs2r-cli.exe":"secs2r-cli.exe","../../target/release/secs2r-host.exe":"secs2r-host.exe","../../target/release/secs2r-host-shell.exe":"secs2r-host-shell.exe"}}}')
          fi
          node ui/node_modules/@tauri-apps/cli/tauri.js "${args[@]}"

      # Windows runners have `python`, not always `python3`.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # Asset names carry a CI version; the CLI reports the workspace version.
      - name: Collect installers
        shell: bash
        run: |
          cli_version="$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")"
          python .github/scripts/collect_bundles.py --name "${{ matrix.name }}" --target "${{ matrix.target }}" --version "0.0.0-ci.${{ github.run_number }}" --cli-version "$cli_version" --out dist

      - name: Prepare macOS playback and recording
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/app-check"
          python -I -u .github/scripts/blackhole.py install --dest "$RUNNER_TEMP/blackhole" 2>&1 | tee "$RUNNER_TEMP/app-check/audio-setup.log"
          bundle_id="$(python -c 'import json; print(json.load(open("apps/secs2r/tauri.conf.json"))["identifier"])')"
          python -I -u .github/scripts/blackhole.py grant-microphone --bundle-id "$bundle_id" 2>&1 | tee -a "$RUNNER_TEMP/app-check/audio-setup.log"

      - name: The macOS app opens and calibrates
        if: runner.os == 'macOS'
        run: python -I -u .github/scripts/macos_app_check.py --dmg dist/*.dmg --work "$RUNNER_TEMP/app-check" --audio-device "BlackHole 2ch"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && runner.os == 'macOS'
        with:
          name: app-check-macos
          path: ${{ runner.temp }}/app-check
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  docs:
    name: rustdoc (deny warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux packages for Tauri and ALSA
        run: |
          # LINUX_DEPS is a space-separated package list, split on purpose.
          # shellcheck disable=SC2086
          sudo apt-get update -qq && sudo apt-get install -y -qq $LINUX_DEPS

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: docs

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny check
        run: cargo deny --all-features check

  # The check name stays as the default branch's "Required checks" ruleset
  # knows it; the job also runs secs-project's parsers (audit #92 TD-60).
  miri:
    name: Miri (secs-jos, secs-mdat, secs-dirac)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned nightly with Miri
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component miri,rust-src
          cargo "+$NIGHTLY" miri setup

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: miri

      # Tests that parse the 218 kB template are ignored under Miri (too slow);
      # they run natively in the test job.
      - name: cargo miri test
        run: cargo "+$NIGHTLY" miri test --locked -p secs-jos -p secs-mdat -p secs-dirac

      # secs-project reads untrusted .secs text and IR WAVs. Its pure parsers
      # run under Miri: the JSON reader (unit tests) and the WAV readers on
      # hand-built byte fixtures. The store tests touch the file system and run
      # natively in the test job (audit #92 TD-60).
      - name: cargo miri test (secs-project parsers)
        run: |
          cargo "+$NIGHTLY" miri test --locked -p secs-project --lib
          cargo "+$NIGHTLY" miri test --locked -p secs-project --test golden -- wav_reader truncated_wav_data

  fuzz:
    name: fuzz (parsers, 60 s per target)
    runs-on: ubuntu-latest
    env:
      FUZZ_TARGET: x86_64-unknown-linux-gnu
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned nightly
        run: rustup toolchain install "$NIGHTLY" --profile minimal

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-fuzz@0.13.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: fuzz
          workspaces: fuzz

      # The prebuilt cargo-fuzz is a musl binary and would default to the musl
      # target, where AddressSanitizer cannot link; name the gnu target.
      - name: Build the fuzz targets
        run: cargo "+$NIGHTLY" fuzz build --target "$FUZZ_TARGET"

      # Seeds per target, in the format each parser reads (audit #92 TD-60):
      # the bundled REW template and the mdat golden blobs for the mdat and
      # jos parsers, the synthetic Dirac Live project, the service golden
      # .secs files and the project WAV goldens (the real sample projects
      # hold personal data). An unknown target fails here so it gets seeds.
      - name: Run every target
        run: |
          for target in $(cargo "+$NIGHTLY" fuzz list); do
            mkdir -p "corpus/$target"
            case "$target" in
              jos_parse|mdat_load|mdat_build_template)
                cp ../src/secs/rew_mdat/template_1.mdat "corpus/$target/template"
                cp ../oracle/goldens/mdat/*.bin "corpus/$target/" ;;
              liveproject_parse)
                cp ../crates/secs-dirac/tests/data/*.liveproject "corpus/$target/" ;;
              project_load_text)
                cp ../oracle/goldens/service_config/*.secs "corpus/$target/" ;;
              wav_read)
                cp ../oracle/goldens/project/wav_*.wav "corpus/$target/" ;;
              *)
                echo "::error::fuzz target $target has no seeds in ci.yml"; exit 1 ;;
            esac
            echo "::group::$target"
            cargo "+$NIGHTLY" fuzz run --target "$FUZZ_TARGET" "$target" "corpus/$target" -- \
              -max_total_time=60 -rss_limit_mb=2048 -max_len=262144
            echo "::endgroup::"
          done

      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14
