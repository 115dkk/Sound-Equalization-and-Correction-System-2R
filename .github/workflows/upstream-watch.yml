name: Upstream watch

# Checks the upstream SECS 2 repository once a day (docs/adr/0001). When its
# branch has moved past UPSTREAM.toml's commit, opens one issue that lists the
# new commits, the changed files and the crates each file reaches, with the
# porting checklist. An open issue with the same title is not duplicated.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Compare with upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compare
        id: watch
        run: python3 .github/scripts/upstream.py watch

      - name: Open the porting issue
        if: steps.watch.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.watch.outputs.title }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --search "\"$TITLE\" in:title" --json title -q '.[].title' || true)"
          if printf '%s\n' "$existing" | grep -Fxq "$TITLE"; then
            echo "an open issue already tracks: $TITLE"
            exit 0
          fi
          if ! gh issue create --title "$TITLE" --body-file upstream-issue.md; then
            echo "::error::could not open an issue; enable Issues in the repository settings"
            cat upstream-issue.md >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
