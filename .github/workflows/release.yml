name: Release

# Publishes a release from every push to main that changes a shipped file
# (docs/adr/0006). Versions are plain v<major>.<minor>.<patch>; while the
# major version is 0 every release is a GitHub prerelease and never takes the
# "latest" spot. 1.0.0, the first official release, is set by hand.
#
#   gate     .github/scripts/release_gate.py: release the workspace version if
#            it has no tag yet; otherwise, when shipped files changed since its
#            tag, bump it (feat: minor, else patch), commit the bump to main as
#            github-actions[bot] and release that
#   build    tests in release mode, then the installers of each OS under
#            stable names (.github/scripts/collect_bundles.py):
#              Windows  NSIS installer and a portable zip (GUI-subsystem check),
#                       both carrying secs2r-cli.exe, and a CLI zip
#              macOS    universal dmg, which must open and calibrate before
#                       it is uploaded (.github/scripts/macos_app_check.py),
#                       and a universal CLI tar.gz
#              Linux    AppImage and deb (built on 22.04 for an older glibc)
#                       and a CLI tar.gz
#            every CLI that ships is run once and must report the version
#   publish  SHA256SUMS.txt, notes from CHANGELOG.md, and the release itself
#            (assets replaced when the tag exists)
#   crates   when the gate says so, the crates.io crates (docs/adr/0016) in
#            dependency order through trusted publishing (a short-lived token
#            from GitHub's OIDC; the repository keeps no crates.io token),
#            then the api-v<version> tag on release_sha
#
# Every job checks out release_sha, the commit the gate decided on (the bump
# commit when it bumped), so a push that lands meanwhile cannot slip in. The
# bump is pushed over SSH with the RELEASE_DEPLOY_KEY deploy key, which the
# default branch's "Required checks" ruleset lets through (the bump commit has
# no checks of its own); its message carries [skip ci], so it does not start
# this workflow again (ci.yml runs on pull requests only). The build jobs restore and save no cache:
# whatever they compile cannot reach a cache another workflow on main would
# trust (CodeQL actions/cache-poisoning), and a release is rare enough to
# build cold.

# Push only. A manual dispatch would let any ref's code run in this workflow;
# a failed release is retried by re-running its run instead.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
    librsvg2-dev libsoup-3.0-dev libasound2-dev patchelf libfuse2

jobs:
  gate:
    name: Release gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The bump push authenticates with the deploy key, not the workflow token.
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.gate.outputs.should_release }}
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
      previous_tag: ${{ steps.gate.outputs.previous_tag }}
      release_sha: ${{ steps.gate.outputs.release_sha }}
      api_publish: ${{ steps.gate.outputs.api_publish }}
      api_version: ${{ steps.gate.outputs.api_version }}
      api_tag: ${{ steps.gate.outputs.api_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Decide (and bump on main)
        id: gate
        run: python3 .github/scripts/release_gate.py

  build:
    name: Installers (${{ matrix.name }})
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis
            target: ""
          - name: macos
            os: macos-15
            bundles: app,dmg
            target: universal-apple-darwin
          - name: linux
            os: ubuntu-22.04
            bundles: appimage,deb
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.release_sha }}

      - name: Linux packages for Tauri and ALSA
        if: runner.os == 'Linux'
        run: |
          # LINUX_DEPS is a space-separated package list, split on purpose.
          # shellcheck disable=SC2086
          sudo apt-get update -qq && sudo apt-get install -y -qq $LINUX_DEPS

      - name: Install the pinned toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - name: Test (release mode)
        # This job builds on older runners on purpose (ubuntu-22.04 keeps the
        # AppImage's glibc floor low), whose libm can differ from the oracle's
        # in the last bit where the probe does not look. Oracle parity is
        # gated in ci.yml; here every oracle test takes its foreign-libm path.
        env:
          SECS_ORACLE_FOREIGN_LIBM: "1"
        run: cargo test --workspace --release --locked

      # Built before tauri build: the Windows installer takes the exe as a
      # resource, and collect_bundles.py packs and runs it on every OS. The
      # macOS CLI is one universal binary like the app.
      - name: Build the CLI
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            cargo build --release --locked -p secs2r-cli --target aarch64-apple-darwin
            cargo build --release --locked -p secs2r-cli --target x86_64-apple-darwin
            mkdir -p target/universal-apple-darwin/release
            lipo -create -output target/universal-apple-darwin/release/secs2r-cli \
              target/aarch64-apple-darwin/release/secs2r-cli \
              target/x86_64-apple-darwin/release/secs2r-cli
          else
            cargo build --release --locked -p secs2r-cli
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: npm ci
        working-directory: apps/secs2r/ui
        run: npm ci --no-audit --no-fund

      - name: tauri build
        working-directory: apps/secs2r
        shell: bash
        run: |
          args=(build --ci --bundles "${{ matrix.bundles }}")
          if [ -n "${{ matrix.target }}" ]; then args+=(--target "${{ matrix.target }}"); fi
          # The installer puts the CLI next to "SECS 2R.exe". Only here, not
          # in tauri.conf.json, so a local tauri dev or build needs no CLI.
          if [ "${{ matrix.name }}" = "windows" ]; then
            args+=(--config '{"bundle":{"resources":{"../../target/release/secs2r-cli.exe":"secs2r-cli.exe"}}}')
          fi
          node ui/node_modules/@tauri-apps/cli/tauri.js "${args[@]}"

      - name: Check the version the CLI reports
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          reported="$(cargo run -q --release --locked -p secs2r-cli -- --version)"
          test "$reported" = "secs2r-cli $VERSION" || { echo "::error::CLI reports '$reported'"; exit 1; }

      # Windows runners have `python`, not always `python3`.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Collect installers
        shell: bash
        run: python .github/scripts/collect_bundles.py --name "${{ matrix.name }}" --target "${{ matrix.target }}" --version "${{ needs.gate.outputs.version }}" --out dist

      - name: Prepare macOS playback and recording
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/app-check"
          python -I -u .github/scripts/blackhole.py install --dest "$RUNNER_TEMP/blackhole" 2>&1 | tee "$RUNNER_TEMP/app-check/audio-setup.log"
          bundle_id="$(python -c 'import json; print(json.load(open("apps/secs2r/tauri.conf.json"))["identifier"])')"
          python -I -u .github/scripts/blackhole.py grant-microphone --bundle-id "$bundle_id" 2>&1 | tee -a "$RUNNER_TEMP/app-check/audio-setup.log"

      - name: The macOS app opens and calibrates
        if: runner.os == 'macOS'
        run: python -I -u .github/scripts/macos_app_check.py --dmg dist/*.dmg --work "$RUNNER_TEMP/app-check" --audio-device "BlackHole 2ch"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && runner.os == 'macOS'
        with:
          name: app-check-macos
          path: ${{ runner.temp }}/app-check
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: [gate, build]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.gate.outputs.tag }}
      VERSION: ${{ needs.gate.outputs.version }}
      PRERELEASE: ${{ needs.gate.outputs.prerelease }}
      PREVIOUS: ${{ needs.gate.outputs.previous_tag }}
      RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      - name: Checksums and notes
        run: |
          set -euo pipefail
          (cd release && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          python3 .github/scripts/release_notes.py --version "$VERSION" --previous "$PREVIOUS" --sha "$RELEASE_SHA" > notes.md
          cat notes.md

      - name: Create or update the release
        run: |
          set -euo pipefail
          flags=(--latest)
          if [ "$PRERELEASE" = "true" ]; then flags=(--prerelease --latest=false); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --notes-file notes.md "${flags[@]}"
          else
            gh release create "$TAG" release/* --target "$RELEASE_SHA" \
              --title "SECS 2R $VERSION" --notes-file notes.md "${flags[@]}"
          fi
          gh release view "$TAG" --json assets,isPrerelease -q '{prerelease: .isPrerelease, assets: [.assets[].name]}'

  crates:
    name: Publish the crates.io crates
    needs: [gate, build]
    if: needs.gate.outputs.should_release == 'true' && needs.gate.outputs.api_publish == 'true'
    runs-on: ubuntu-latest
    # crates.io accepts this job's OIDC token only from this workflow file and
    # this environment (the trusted publisher of every published crate).
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      API_VERSION: ${{ needs.gate.outputs.api_version }}
      API_TAG: ${{ needs.gate.outputs.api_tag }}
      RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.release_sha }}

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      # One crate at a time in dependency order; a version crates.io already
      # has is skipped, so a run that stopped half way can be re-run.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 .github/scripts/publish_crates.py --version "$API_VERSION"

      - name: Tag the published version
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${API_TAG}" >/dev/null 2>&1; then
            echo "${API_TAG} already exists"
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${API_TAG}" -f sha="${RELEASE_SHA}"
          fi
