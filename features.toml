# Feature registry (docs/adr/0002). A capability that is not listed here does
# not exist. The gates in crates/secs-policy fail when:
#   * an id repeats, a kind is empty, or a status or milestone is not one of
#     the values below,
#   * a feature marked "implemented" lists no tests,
#   * a listed test ("crate-name::test_fn") does not exist in that crate,
#   * an IPC method of secs-types has no "ipc.<method>" entry.
# Marking a feature implemented without a verification test is a CI failure by
# design; .github/scripts/check_feature_tests.py also asks Cargo that every
# referenced test is compiled and run. Statuses: planned, partial,
# implemented. Milestones: M0 to M6 (docs/ARCHITECTURE.md). `upstream` names the SECS 2 source a feature ports;
# "new" marks what SECS 2 does not have.

# ---- Policy (M0) ----

[[feature]]
id = "policy.unsafe_forbid_everywhere"
kind = "policy"
milestone = "M0"
status = "implemented"
tests = [
  "secs-policy::every_crate_root_forbids_unsafe",
  "secs-policy::budgeted_crates_carry_the_unsafe_lint_table",
  "secs-policy::no_unsafe_outside_budget",
  "secs-policy::budget_names_only_existing_crates",
  "secs-policy::unsafe_scanner_ignores_comments_strings_and_chars",
  "secs-policy::crate_attribute_must_precede_every_block",
]

[[feature]]
id = "policy.feature_registry"
kind = "policy"
milestone = "M0"
status = "implemented"
tests = [
  "secs-policy::features_registry_is_well_formed",
  "secs-policy::implemented_features_have_existing_tests",
  "secs-policy::test_detector_finds_test_attribute",
  "secs-policy::test_detector_rejects_plain_function",
  "secs-policy::test_detector_finds_proptest_function",
  "secs-policy::test_detector_ignores_comments_and_strings",
]

[[feature]]
id = "policy.os_code_stays_in_secs_sys"
kind = "policy"
milestone = "M0"
status = "implemented"
tests = ["secs-policy::os_code_stays_in_secs_sys"]
note = "only secs-sys names OS-facing crates (wasapi, cpal, windows*, libc, OS probes); only crates under apps/ depend on secs-sys"

[[feature]]
id = "policy.no_dirty_avx_kernels"
kind = "policy"
milestone = "M0"
status = "implemented"
tests = ["secs-policy::no_assembly_kernels_that_leave_avx_state_dirty"]

[[feature]]
id = "policy.subprocess_allowlist"
kind = "policy"
milestone = "M0"
status = "implemented"
tests = [
  "secs-policy::no_shell_subprocesses",
  "secs-policy::subprocess_scanner_checks_code_raw_text_and_exact_allowlist",
]
note = "only the REW launcher may start a process"

[[feature]]
id = "policy.ipc_registered"
kind = "policy"
milestone = "M0"
status = "implemented"
tests = ["secs-policy::ipc_methods_are_registered", "secs-types::method_names_match_the_wire"]

[[feature]]
id = "policy.upstream_tree"
kind = "policy"
milestone = "M0"
status = "implemented"
tests = ["secs-policy::upstream_tree_is_present"]
note = "CI also checks the Python tree is byte-identical to UPSTREAM.toml's commit (.github/scripts/upstream.py)"

