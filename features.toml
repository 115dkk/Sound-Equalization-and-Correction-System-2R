# Feature registry (docs/adr/0002). A capability that is not listed here does
# not exist. The gates in crates/secs-policy fail when:
#   * an id repeats, a kind is empty, or a status or milestone is not one of
#     the values below,
#   * a feature marked "implemented" lists no tests,
#   * a listed test ("crate-name::test_fn") does not exist in that crate,
#   * an IPC method of secs-types has no "ipc.<method>" entry.
# Marking a feature implemented without a verification test is a CI failure by
# design; .github/scripts/check_feature_tests.py also asks Cargo that every
# referenced test is compiled and run. Statuses: planned, partial,
# implemented. Milestones: M0 to M6 (docs/ARCHITECTURE.md). `upstream` names the SECS 2 source a feature ports;
# "new" marks what SECS 2 does not have.

[[feature]]
id = "engine.peq_fit"
kind = "engine"
milestone = "M2"
status = "implemented"
upstream = "correction_engine.py fit_peq, _ring_q_cap, _ring_boxes, fit_gd_cuts, _xo_target_peq"
tests = [
  "secs-engine::peq_greedy_and_ring_oracle",
  "secs-engine::peq_frozen_residual_and_jacobian",
  "secs-engine::peq_trf_replay",
  "secs-engine::peq_results_within_secs2_spread",
  "secs-engine::xo_target_rebuilt_inputs",
  "secs-engine::replay_fitter_rejects_mismatch",
  "secs-engine::gd_flat_response_has_no_cuts",
]
note = "End results gated on SECS 2's own spread (twelve runs, ADR 0004); bound-stride replay errors are SciPy select_step's own sensitivity (P07c). P09 checks GD-cut inputs and application."

[[feature]]
id = "engine.design"
kind = "engine"
milestone = "M2"
status = "implemented"
upstream = "CorrectionEngine.compute and calibration.compute"
tests = ["secs-engine::design_matches_recorded_stages", "secs-engine::design_cancellation_returns_within_one_second"]
note = "Replayed design matches the recorded stages (room after BA reported, its DE diverges); cancellation returns within 1 s at five points of the dolby design (the fitter stops at its next gradient test)."

[[feature]]
id = "engine.simulator"
kind = "engine"
milestone = "M2"
status = "implemented"
upstream = "CorrectionEngine.stage_responses and input_response"
tests = ["secs-engine::simulator_matches_recorded_stages"]

[[feature]]
id = "engine.e2e_demo"
kind = "engine"
milestone = "M2"
status = "implemented"
upstream = "calibration.compute on the demo room"
tests = ["secs-engine::engine_e2e_spread"]
note = "ADR 0004 per-value 3*max(spread, quantum) cap and exact binomial 99.9% CDF gates pass on oracle and forced-foreign libm paths. Four 1.25-spread exceedances remain reports. Neutral descriptors and chain scalars use two-sided caps and do not enter directional rank counts."

[[feature]]
id = "perf.engine"
kind = "perf"
milestone = "M2"
status = "implemented"
upstream = "calibration.compute, recommend_xo, previews and exports"
tests = ["secs-engine::design_matches_recorded_stages", "secs-engine::engine_e2e_spread", "secs-engine::peq_cached_residual_is_bit_equal", "secs-engine::design_parallel_progress_counts_completed_channels", "secs-engine::preview_sub_combine_replayed_designs", "secs-dsp::cached_bounds_match_smoothing_bits_and_errors", "secs-engine::xo_preparation_is_candidate_independent", "secs-engine::xo_shared_preparation_preserves_candidate_bits", "secs-engine::xo_shared_windows_preserve_filtered_bits", "secs-camilla::streaming_json_matches_recursive_bytes"]
note = "docs/perf/engine.md records the paired release audit (P13, P13b, P13c): every operation is faster than SECS 2 in both configurations and Rust uses less aggregate memory. Timing is not a CI gate; the tests prove the speed-ups kept the results."

[[feature]]
id = "perf.mimo"
kind = "perf"
milestone = "M3"
status = "implemented"
upstream = "mimo.design_mimo, mimo_iir.design_mimo_iir, calibration.compute_mimo and MIMO exports"
tests = ["secs-engine::mimo_input_selection_preserves_all_input_result", "secs-engine::mimo_stage_boundary_goldens", "secs-engine::mimo_whole_path_goldens", "secs-engine::mimo_iir_whole_path_within_spread_and_deterministic", "secs-engine::mimo_ridge_sweep_recorded_systems_and_trajectories", "secs-engine::mimo_ridge_sweep_falls_back", "secs-engine::mimo_deterministic_threads", "secs-engine::mimo_shared_preparation_bit_identical", "secs-engine::mimo_compute_shared_preparation_bit_identical", "secs-engine::mimo_shared_paths_reject_combined_budget"]
note = "docs/perf/mimo.md (P18, P18b, P18c): on the big case the default MIMO run is 11x (one thread) and over 64x (shipped) faster than SECS 2, with peak PSS 0.79 GB against at least 1.86 GB. The ideal FIR design step alone and FIR mode with one thread stay below 5x (docs/MIMO.md section 6). Timing is not a CI gate; the tests prove the speed-ups kept the results."

