upstream = "scipy.optimize.least_squares trf_bounds (exact) via normal equations"
note = "JᵀJ and Jᵀf instead of the Jacobian; the augmented SVD becomes a symmetric eigendecomposition (docs/MIMO.md §3). Used by the MIMO IIR fit."

[[feature]]
