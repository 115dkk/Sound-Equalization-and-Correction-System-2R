[package]
name = "secs2r-host"
description = "Windows service that keeps managed CamillaDSP and Equalizer APO configurations active."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "secs2r-host"
path = "src/main.rs"

[dependencies]
clap.workspace = true

# The service exists only on Windows; elsewhere main is a stub that parses
# its arguments and refuses.
[target.'cfg(windows)'.dependencies]
secs-apply.workspace = true
secs-service.workspace = true
secs-sys = { path = "../../crates/secs-sys" }
secs-types.workspace = true
base64.workspace = true
minisign-verify = "=0.3.0"
semver = "1"
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true

# The rules, files and transitions modules are tested on every OS.
[dev-dependencies]
secs-apply.workspace = true
secs-service.workspace = true
secs-types.workspace = true
base64.workspace = true
minisign-verify = "=0.3.0"
semver = "1"
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
