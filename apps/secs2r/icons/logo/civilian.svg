<!-- SECS 2R logo, "킹반인 모드" (docs/DEVIATIONS.md U12): a measured room
     response (pink) and the corrected response on the target (teal) with
     PEQ handles, on upstream's chassis tile. Drawn for SECS 2R; GPL-3.0 with
     the rest of the repository. 32 px and smaller use civilian_small.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a5c58"/>
      <stop offset=".5" stop-color="#1e3736"/>
      <stop offset="1" stop-color="#0f1f1e"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".24"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="measured" x1="7" y1="0" x2="57" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff0a6c"/>
      <stop offset=".45" stop-color="#ff4d7c" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ff9a8e" stop-opacity=".45"/>
    </linearGradient>
    <radialGradient id="light" cx="18" cy="10" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5fd6cc" stop-opacity=".22"/>
      <stop offset="1" stop-color="#5fd6cc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="40" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".28"/>
    </linearGradient>
    <radialGradient id="halo" r="5" cx="0" cy="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#30e3da" stop-opacity=".55"/>
      <stop offset="1" stop-color="#30e3da" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="7" y1="0" x2="57" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff2a76" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ff2a76" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="gridMajor" x1="0" y1="9" x2="0" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gridMinor" x1="0" y1="9" x2="0" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gridRow" x1="8" y1="0" x2="56" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="target" x1="7" y1="0" x2="57" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7ff7ef"/>
