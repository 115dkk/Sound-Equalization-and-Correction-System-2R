    <path d="M8 20H56M8 44H56" stroke="url(#gridRow)" stroke-width=".5"/>
  </g>
  <path d="M7 34 C9 34 10 19 12.5 19 C15 19 15 44 17.5 44 C19.5 44 20 25 22 25 C23.6 25 24 39 25.6 39 C27 39 27.4 28 28.8 28 C30 28 30.4 36 31.6 36 C32.8 36 33.2 29.5 34.4 29.5 C35.6 29.5 36 34.5 37.2 34.5 C38.4 34.5 38.8 30.5 40 30.5 C41.2 30.5 41.6 35 42.8 35 C44 35 44.4 31 45.6 31 C46.8 31 47.2 37 48.6 37 C50 37 50.6 33 52 34 C53.4 35 54.2 39 57 41 L57 35.2 C40 32.6 20 31 7 30.5 Z" fill="url(#area)"/>
  <path d="M7 34 C9 34 10 19 12.5 19 C15 19 15 44 17.5 44 C19.5 44 20 25 22 25 C23.6 25 24 39 25.6 39 C27 39 27.4 28 28.8 28 C30 28 30.4 36 31.6 36 C32.8 36 33.2 29.5 34.4 29.5 C35.6 29.5 36 34.5 37.2 34.5 C38.4 34.5 38.8 30.5 40 30.5 C41.2 30.5 41.6 35 42.8 35 C44 35 44.4 31 45.6 31 C46.8 31 47.2 37 48.6 37 C50 37 50.6 33 52 34 C53.4 35 54.2 39 57 41" stroke="url(#measured)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-opacity=".95"/>
  <g fill="none" stroke-linecap="round">
    <path d="M7 32.3 C20 32.8 40 34.4 57 37" stroke="#000000" stroke-opacity=".35" stroke-width="3.4"/>
    <path d="M7 30.5 C20 31 40 32.6 57 35.2" stroke="#30e3da" stroke-opacity=".12" stroke-width="9"/>
    <path d="M7 30.5 C20 31 40 32.6 57 35.2" stroke="#30e3da" stroke-opacity=".26" stroke-width="5.5"/>
    <path d="M7 30.5 C20 31 40 32.6 57 35.2" stroke="url(#target)" stroke-width="3"/>
  </g>
  <g fill="url(#halo)">
    <circle cx="0" cy="0" r="5" transform="translate(12.5 30.7)"/>
    <circle cx="0" cy="0" r="5" transform="translate(22 31.1)"/>
    <circle cx="0" cy="0" r="5" transform="translate(40 32.8)"/>
  </g>
  <g fill="#ffffff" stroke="#163130" stroke-width=".9">
    <circle cx="12.5" cy="30.7" r="2"/>
    <circle cx="22" cy="31.1" r="2"/>
    <circle cx="40" cy="32.8" r="2"/>
  </g>
  <rect width="64" height="64" rx="12" fill="url(#vignette)"/>
  <rect x=".5" y=".5" width="63" height="63" rx="11.5" fill="none" stroke="url(#edge)" stroke-width="1"/>
