[package]
name = "secs2r"
description = "SECS 2R desktop app: a thin Tauri 2 shell over secs-service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "secs2r"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
secs-service.workspace = true
secs-gpu = { path = "../../crates/secs-gpu" }
secs-types.workspace = true
secs-rew.workspace = true
secs-sys = { path = "../../crates/secs-sys" }
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "=2.6.0"
tauri-plugin-opener = "=2.5.0"
