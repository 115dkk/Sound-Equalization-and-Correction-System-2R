# ts-rs writes the IPC bindings of secs-types here whenever its tests run; CI
# regenerates them and fails if the committed copy differs (docs/adr/0003).
[env]
TS_RS_EXPORT_DIR = { value = "apps/secs2r/ui/src/ipc/bindings", relative = true }
# JSON carries every number as a double, so i64/u64 fields arrive as numbers;
# all of them (positions, outputs, tap counts, budgets) stay far below 2^53.
TS_RS_LARGE_INT = "number"
