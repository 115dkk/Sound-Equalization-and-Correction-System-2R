# cargo-deny policy, checked by the `deny` job of ci.yml.

[graph]
all-features = true

[licenses]
# SECS 2R ships under GPL-3.0-only (docs/adr/0001). Every dependency must be
# compatible with distributing the combined binaries under it: permissive
# licenses, weak copyleft (MPL-2.0, LGPL) and GPL-3.0 itself. GPL-2.0-only and
# AGPL are not compatible in that direction and stay out.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are publish = false and inherit GPL-3.0-only.
ignore = true

[advisories]
# A vulnerability is denied wherever it sits. Unmaintained crates are judged
# only where this workspace can act on them (Tauri's Linux stack pulls in GTK3
# bindings that RustSec lists as unmaintained).
unmaintained = "workspace"
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace crates carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
